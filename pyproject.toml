[project]
name = "foodfindr"
version = "1.0.0"
description = "Our project for StormHacks 2026. List ingredients you have, and find recipes that incorporate them. Lacking ingredients you need? Find where to purchase them for the cheapest price close by!"
readme = "README.md"
requires-python = ">=3.10"

[tool.poetry.dependencies]
flask = "^3.1.3"
requests = "^2.34.2"
snowflake-connector-python = "^4.8.0"
sseclient-py = "^1.9.0"
tomli = {version = "^2.0.1", python = "<3.11"}

[project.scripts]
foodfindr = 'foodfindr.app:runapp'

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
